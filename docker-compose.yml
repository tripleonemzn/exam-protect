version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
  backend:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      DB_DSN: postgres://exam:exam@db:5432/exam?sslmode=disable
      HTTP_ADDR: ":8080"
      ADMIN_JWT_SECRET: "dev-admin-secret"
      LAUNCH_JWT_SECRET: "dev-launch-secret"
      LAUNCH_JWT_SIGNED: "false"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
volumes:
  dbdata: {}
